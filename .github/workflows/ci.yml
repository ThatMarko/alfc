name: ci

on:
  push:
    branches: [master]
  # All pull requests, not just ones targeting master — stacked feature
  # branches get the same checks (including the Windows WmiDll build).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type-check, test, build
        run: bun run all-checks

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type-check, test, build
        run: bun run all-checks

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build WmiDll
        run: build.bat
        shell: cmd
        working-directory: server/native/windows/wmidll
