name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node for development tools
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || exit 1
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Release tag must match package.json version"; exit 1; }

      - name: Audit installed dependencies
        run: bun audit

      - name: Run checks
        run: bun run all-checks

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Assemble Linux release
        env:
          ALFC_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$ALFC_RELEASE_VERSION"
          RELEASE_DIR="alfc-${VERSION}-linux-x64"
          mkdir -p "${RELEASE_DIR}"

          # Server binary
          cp server/dist/alfc "${RELEASE_DIR}/"

          # Frontend
          cp -r frontend/build "${RELEASE_DIR}/frontend"

          # Default config
          cp alfc.config.json "${RELEASE_DIR}/"

          # Service scripts and template
          cp bootstrap/scripts/linux/install.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/uninstall.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/run.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/alfc.service "${RELEASE_DIR}/"

          # Optional unprivileged Omarchy shell integration
          mkdir -p "${RELEASE_DIR}/omarchy"
          cp omarchy/install.sh omarchy/uninstall.sh omarchy/manage.py "${RELEASE_DIR}/omarchy/"
          cp -r omarchy/module "${RELEASE_DIR}/omarchy/module"

          # Plasmoid
          mkdir -p "${RELEASE_DIR}/plasmoid"
          cp -r plasmoid/package "${RELEASE_DIR}/plasmoid/package"
          cp plasmoid/install.sh "${RELEASE_DIR}/plasmoid/"
          cp plasmoid/uninstall.sh "${RELEASE_DIR}/plasmoid/"
          cp plasmoid/*.md "${RELEASE_DIR}/plasmoid/"

          # License and docs
          cp LICENSE "${RELEASE_DIR}/"
          cp ./*.md "${RELEASE_DIR}/"
          mkdir -p "${RELEASE_DIR}/common" "${RELEASE_DIR}/aur" "${RELEASE_DIR}/assets"
          cp common/*.md "${RELEASE_DIR}/common/"
          cp aur/README.md "${RELEASE_DIR}/aur/"
          cp assets/screenshot.png "${RELEASE_DIR}/assets/"

          # Create archive
          tar -czf "${RELEASE_DIR}.tar.gz" "${RELEASE_DIR}"

          # Also create standalone .plasmoid for KDE Store
          cd plasmoid/package
          zip -r "../../org.kde.alfc.plasmoid" .
          cd ../..

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-release
          retention-days: 5
          if-no-files-found: error
          path: |
            alfc-*-linux-x64.tar.gz
            org.kde.alfc.plasmoid

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node for development tools
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || exit 1
          VERSION="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Release tag must match package.json version"; exit 1; }

      - name: Audit installed dependencies
        run: bun audit

      - name: Lint, type-check, test, and build
        run: bun run all-checks

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build WmiDll
        run: build.bat
        shell: cmd
        working-directory: server/native/windows/wmidll

      - name: Verify Windows COM completion and integer decoding
        shell: cmd
        working-directory: server/native/windows/wmidll
        run: |
          cl /nologo /EHsc WmiNative.test.cpp /Fe:"%RUNNER_TEMP%\alfc-wmi-native-test.exe" /link ole32.lib oleaut32.lib wbemuuid.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\alfc-wmi-native-test.exe"

      - name: Download WinSW
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "WinSW-x64.exe"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Assemble Windows release
        shell: bash
        env:
          ALFC_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$ALFC_RELEASE_VERSION"
          RELEASE_DIR="alfc-${VERSION}-windows-x64"
          mkdir -p "${RELEASE_DIR}"

          # Server binary
          cp server/dist/alfc.exe "${RELEASE_DIR}/"

          # WMI DLL (C++ COM wrapper loaded via bun:ffi)
          cp server/native/windows/wmidll/WmiDll.dll "${RELEASE_DIR}/"

          # NOTE: CPUOC.dll and IntelOverclockingSDK.dll are NOT included.
          # CPU tuning is an unsupported prototype; a separately validated
          # adapter/SDK integration is required. See RELEASING.md.

          # Frontend
          cp -r frontend/build "${RELEASE_DIR}/frontend"

          # Default config
          cp alfc.config.json "${RELEASE_DIR}/"

          # Service scripts
          cp bootstrap/scripts/install.bat "${RELEASE_DIR}/"
          cp bootstrap/scripts/uninstall.bat "${RELEASE_DIR}/"
          cp bootstrap/scripts/run.bat "${RELEASE_DIR}/"

          # WinSW service wrapper (MIT licensed)
          cp WinSW-x64.exe "${RELEASE_DIR}/alfc-service.exe"
          cp bootstrap/scripts/alfc-service.xml "${RELEASE_DIR}/"

          # License and docs
          cp LICENSE "${RELEASE_DIR}/"
          cp ./*.md "${RELEASE_DIR}/"
          mkdir -p "${RELEASE_DIR}/common" "${RELEASE_DIR}/plasmoid" "${RELEASE_DIR}/aur" "${RELEASE_DIR}/assets"
          cp common/*.md "${RELEASE_DIR}/common/"
          cp plasmoid/*.md "${RELEASE_DIR}/plasmoid/"
          mkdir -p "${RELEASE_DIR}/plasmoid/package/contents/ui" "${RELEASE_DIR}/omarchy"
          cp plasmoid/package/contents/ui/Protocol.js "${RELEASE_DIR}/plasmoid/package/contents/ui/"
          cp omarchy/install.sh omarchy/uninstall.sh omarchy/manage.py "${RELEASE_DIR}/omarchy/"
          cp -r omarchy/module "${RELEASE_DIR}/omarchy/module"
          cp aur/README.md "${RELEASE_DIR}/aur/"
          cp assets/screenshot.png "${RELEASE_DIR}/assets/"

      - name: Create zip
        shell: bash
        env:
          ALFC_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$ALFC_RELEASE_VERSION"
          7z a "alfc-${VERSION}-windows-x64.zip" "alfc-${VERSION}-windows-x64"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          retention-days: 5
          if-no-files-found: error
          path: alfc-*-windows-x64.zip

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Get version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact checksums
        run: |
          (cd artifacts/linux-release && sha256sum alfc-*-linux-x64.tar.gz org.kde.alfc.plasmoid) > artifacts/SHA256SUMS
          (cd artifacts/windows-release && sha256sum alfc-*-windows-x64.zip) >> artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: "ALFC ${{ steps.meta.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-release/alfc-*-linux-x64.tar.gz
            artifacts/linux-release/org.kde.alfc.plasmoid
            artifacts/windows-release/alfc-*-windows-x64.zip
            artifacts/SHA256SUMS
