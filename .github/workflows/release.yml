name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run all-checks

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Assemble Linux release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="alfc-${VERSION}-linux-x64"
          mkdir -p "${RELEASE_DIR}"

          # Server binary
          cp server/dist/alfc "${RELEASE_DIR}/"

          # Frontend
          cp -r frontend/build "${RELEASE_DIR}/frontend"

          # Default config
          cp alfc.config.json "${RELEASE_DIR}/"

          # Service scripts and template
          cp bootstrap/scripts/linux/install.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/uninstall.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/run.sh "${RELEASE_DIR}/"
          cp bootstrap/scripts/linux/alfc.service "${RELEASE_DIR}/"

          # Plasmoid
          mkdir -p "${RELEASE_DIR}/plasmoid"
          cp -r plasmoid/package "${RELEASE_DIR}/plasmoid/package"
          cp plasmoid/install.sh "${RELEASE_DIR}/plasmoid/"
          cp plasmoid/uninstall.sh "${RELEASE_DIR}/plasmoid/"
          cp plasmoid/DEPENDENCIES.md "${RELEASE_DIR}/plasmoid/"

          # License and docs
          cp LICENSE "${RELEASE_DIR}/"
          cp README.md "${RELEASE_DIR}/"
          cp LINUX.md "${RELEASE_DIR}/"

          # Create archive
          tar -czf "${RELEASE_DIR}.tar.gz" "${RELEASE_DIR}"

          # Also create standalone .plasmoid for KDE Store
          cd plasmoid/package
          zip -r "../../org.kde.alfc.plasmoid" .
          cd ../..

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          retention-days: 5
          path: |
            alfc-*-linux-x64.tar.gz
            org.kde.alfc.plasmoid

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend and server
        run: bun run build

      - name: Build WmiAPI helper
        run: dotnet publish server/native/windows/wmiapi -c Release -o server/native/windows

      - name: Download WinSW
        run: |
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile "WinSW-x64.exe"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Assemble Windows release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="alfc-${VERSION}-windows-x64"
          mkdir -p "${RELEASE_DIR}"

          # Server binary
          cp server/dist/alfc.exe "${RELEASE_DIR}/"

          # WMI helper (.NET Framework 4.8 exe — runtime built into Windows 11)
          cp server/native/windows/WmiAPI.exe "${RELEASE_DIR}/"

          # NOTE: CPUOC.dll and IntelOverclockingSDK.dll are NOT included.
          # CPU tuning requires users to build CPUOC.dll themselves.
          # See docs for details.

          # Frontend
          cp -r frontend/build "${RELEASE_DIR}/frontend"

          # Default config
          cp alfc.config.json "${RELEASE_DIR}/"

          # Service scripts
          cp bootstrap/scripts/install.bat "${RELEASE_DIR}/"
          cp bootstrap/scripts/uninstall.bat "${RELEASE_DIR}/"
          cp bootstrap/scripts/run.bat "${RELEASE_DIR}/"

          # WinSW service wrapper (MIT licensed)
          cp WinSW-x64.exe "${RELEASE_DIR}/alfc-service.exe"
          cp bootstrap/scripts/alfc-service.xml "${RELEASE_DIR}/"

          # License and docs
          cp LICENSE "${RELEASE_DIR}/"
          cp README.md "${RELEASE_DIR}/"

      - name: Create zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          7z a "alfc-${VERSION}-windows-x64.zip" "alfc-${VERSION}-windows-x64"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          retention-days: 5
          path: alfc-*-windows-x64.zip

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ALFC ${{ steps.meta.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-release/alfc-*-linux-x64.tar.gz
            artifacts/linux-release/org.kde.alfc.plasmoid
            artifacts/windows-release/alfc-*-windows-x64.zip
